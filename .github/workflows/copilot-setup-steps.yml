name: "Copilot Setup Steps"

# Run setup steps when changed, and allow manual testing from the Actions tab.
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
                  tools: composer:v2
                  coverage: none

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer dependencies
              uses: actions/cache@v5
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: copilot-php-8.3-composer-${{ hashFiles('composer.json') }}
                  restore-keys: copilot-php-8.3-

            - name: Install Composer dependencies
              run: |
                  composer require "laravel/framework:13.*" "livewire/livewire:4.*" "openspout/openspout:^4.23" \
                    --no-interaction --no-update
                  composer install --no-progress --optimize-autoloader --no-scripts

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "yarn"

            - name: Install Node.js dependencies
              run: yarn install --frozen-lockfile
